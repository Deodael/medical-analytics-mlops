name: MLOps Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-pipeline:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the repository code onto the runner machine
    - name: Checkout repository code
      uses: actions/checkout@v4

    # 2. Set up an isolated Python runtime environment
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. Cache dependencies to speed up subsequent workflow runs
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # 4. Install production and testing packages
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 5. Run the full pytest suite with local pathing enabled
    - name: Run automated component verification
      env:
        PYTHONPATH: .
      run: |
        pytest
