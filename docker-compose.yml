version: '3.8'

services:
  # 1. The FastAPI Backend Microservice
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app

  # 2. The Streamlit Frontend Dashboard
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - backend
